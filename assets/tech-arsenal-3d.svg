  <g transform="translate(35, 218)">
    <rect x="0" y="0" width="445" height="135" rx="12" fill="#091024" stroke="#142040" stroke-width="1.2"/>
    
    <!-- Bay Header -->
    <text x="16" y="24" fill="#38ef7d" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" letter-spacing="0.5">
      ⚙️ BACKEND, APIS &amp; CLOUD
    </text>
    <rect x="345" y="10" width="85" height="20" rx="4" fill="#38ef7d" opacity="0.12" stroke="#38ef7d" stroke-width="0.8"/>
    <text x="387" y="24" fill="#38ef7d" font-family="'Fira Code', monospace" font-size="10" font-weight="700" text-anchor="middle">SCALABLE</text>

    <!-- Chips Row -->
    <g transform="translate(16, 42)">
      <rect x="0" y="0" width="90" height="36" rx="6" fill="#12182b" stroke="#1f293d" stroke-width="1"/>
      <text x="45" y="22" fill="#ffffff" font-family="'Fira Code', monospace" font-size="12" font-weight="700" text-anchor="middle">Node.js</text>

      <rect x="100" y="0" width="90" height="36" rx="6" fill="#12182b" stroke="#1f293d" stroke-width="1"/>
      <text x="145" y="22" fill="#38ef7d" font-family="'Fira Code', monospace" font-size="12" font-weight="700" text-anchor="middle">FastAPI</text>

      <rect x="200" y="0" width="85" height="36" rx="6" fill="#12182b" stroke="#1f293d" stroke-width="1"/>
      <text x="242" y="22" fill="#ffffff" font-family="'Fira Code', monospace" font-size="12" font-weight="700" text-anchor="middle">Python</text>

      <rect x="295" y="0" width="120" height="36" rx="6" fill="#12182b" stroke="#1f293d" stroke-width="1"/>
      <text x="355" y="22" fill="#00F2FE" font-family="'Fira Code', monospace" font-size="11.5" font-weight="700" text-anchor="middle">Docker • AWS</text>
    </g>

    <!-- Specs Subtitle -->
    <text x="16" y="102" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5">
      ✦ Zero-Fee Payment Gateways • Webhooks • Linux Daemons • High Throughput
    </text>
    <rect x="16" y="115" width="415" height="4" rx="2" fill="#161b2e"/>
    <rect x="16" y="115" width="390" height="4" rx="2" fill="url(#neon-green)"/>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════
       BAY 4: DATA, ON-DEVICE AI & DESIGN (BOTTOM-RIGHT)
       ══════════════════════════════════════════════════════════════════ -->
  <g transform="translate(520, 218)">
    <rect x="0" y="0" width="445" height="135" rx="12" fill="#091024" stroke="#142040" stroke-width="1.2"/>
    
    <!-- Bay Header -->
    <text x="16" y="24" fill="#f59e0b" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" letter-spacing="0.5">
      🤖 ON-DEVICE AI &amp; DESIGN TOOLS
    </text>
    <rect x="345" y="10" width="85" height="20" rx="4" fill="#f59e0b" opacity="0.12" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="387" y="24" fill="#fbbf24" font-family="'Fira Code', monospace" font-size="10" font-weight="700" text-anchor="middle">AI + 3D</text>

    <!-- Chips Row -->
    <g transform="translate(16, 42)">
      <rect x="0" y="0" width="95" height="36" rx="6" fill="#12182b" stroke="#1f293d" stroke-width="1"/>
      <text x="47" y="22" fill="#ffffff" font-family="'Fira Code', monospace" font-size="12" font-weight="700" text-anchor="middle">Supabase</text>

      <rect x="105" y="0" width="95" height="36" rx="6" fill="#12182b" stroke="#1f293d" stroke-width="1"/>
      <text x="152" y="22" fill="#f59e0b" font-family="'Fira Code', monospace" font-size="12" font-weight="700" text-anchor="middle">ML Kit</text>

      <rect x="210" y="0" width="85" height="36" rx="6" fill="#12182b" stroke="#1f293d" stroke-width="1"/>
      <text x="252" y="22" fill="#ffffff" font-family="'Fira Code', monospace" font-size="12" font-weight="700" text-anchor="middle">Figma</text>

      <rect x="305" y="0" width="110" height="36" rx="6" fill="#12182b" stroke="#1f293d" stroke-width="1"/>
      <text x="360" y="22" fill="#00F2FE" font-family="'Fira Code', monospace" font-size="11.5" font-weight="700" text-anchor="middle">PostgreSQL</text>
