<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="tech-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050714"/>
      <stop offset="50%" stop-color="#0a0e24"/>
      <stop offset="100%" stop-color="#040612"/>
    </linearGradient>

    <!-- Glowing Neons -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <linearGradient id="neon-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="neon-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>
    <linearGradient id="neon-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ff7b00"/>
    </linearGradient>

    <!-- Animated Sheen Border -->
    <linearGradient id="arsenal-sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#38ef7d" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.9"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="14s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="chip-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Animated Sheen Frame -->
  <rect x="2" y="2" width="996" height="376" rx="18" fill="none" stroke="url(#arsenal-sheen)" stroke-width="2.2"/>

  <!-- Canvas Background -->
  <rect x="4" y="4" width="992" height="372" rx="16" fill="url(#tech-bg)"/>

  <!-- Perspective Circuit Grid -->
  <g opacity="0.04" stroke="#00F2FE" stroke-width="0.5">
    <line x1="0" y1="60" x2="1000" y2="60"/><line x1="0" y1="120" x2="1000" y2="120"/><line x1="0" y1="180" x2="1000" y2="180"/>
    <line x1="0" y1="240" x2="1000" y2="240"/><line x1="0" y1="300" x2="1000" y2="300"/>
    <line x1="250" y1="0" x2="250" y2="380"/><line x1="500" y1="0" x2="500" y2="380"/><line x1="750" y1="0" x2="750" y2="380"/>
  </g>

  <!-- Animated Electronic Pulses along Center Bus Line -->
  <line x1="500" y1="56" x2="500" y2="355" stroke="#16223d" stroke-width="2" stroke-dasharray="4 6"/>
  <circle cx="500" cy="80" r="3" fill="#00F2FE" filter="url(#chip-glow)">
    <animate attributeName="cy" values="56;355;56" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="200" r="2.5" fill="#a855f7" filter="url(#chip-glow)">
    <animate attributeName="cy" values="355;56;355" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Top Title Bar -->
  <g transform="translate(35, 34)">
    <circle cx="6" cy="6" r="4.5" fill="#00F2FE">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="22" y="10" fill="#00F2FE" font-family="'Fira Code', monospace" font-size="12" font-weight="700" letter-spacing="1.5">
      ⚡ 3D TECH ARSENAL &amp; HARDWARE BUS // 60-120 FPS TOOLCHAIN
    </text>
    <text x="930" y="10" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="11" font-weight="600" text-anchor="end">
      ZERO BLOAT // ARCHITECTURE v4.2 ✦
    </text>
  </g>

  <line x1="35" y1="52" x2="965" y2="52" stroke="#1f293d" stroke-width="1.2"/>

  <!-- ══════════════════════════════════════════════════════════════════
       BAY 1: MOBILE & CROSS-PLATFORM CORE (TOP-LEFT)
       ══════════════════════════════════════════════════════════════════ -->
  <g transform="translate(35, 68)">
    <rect x="0" y="0" width="445" height="135" rx="12" fill="#091024" stroke="#142040" stroke-width="1.2"/>
    
    <!-- Bay Header -->
    <text x="16" y="24" fill="#00F2FE" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" letter-spacing="0.5">
      📱 MOBILE ENGINE (FLAGSHIP)
    </text>
    <rect x="345" y="10" width="85" height="20" rx="4" fill="#00F2FE" opacity="0.12" stroke="#00F2FE" stroke-width="0.8"/>
    <text x="387" y="24" fill="#00F2FE" font-family="'Fira Code', monospace" font-size="10" font-weight="700" text-anchor="middle">120 FPS</text>

    <!-- Chips Row 1 -->
    <g transform="translate(16, 42)">
      <rect x="0" y="0" width="95" height="36" rx="6" fill="#12182b" stroke="#1f293d" stroke-width="1"/>
      <text x="47" y="22" fill="#ffffff" font-family="'Fira Code', monospace" font-size="12" font-weight="700" text-anchor="middle">Flutter</text>

      <rect x="105" y="0" width="75" height="36" rx="6" fill="#12182b" stroke="#1f293d" stroke-width="1"/>
      <text x="142" y="22" fill="#00F2FE" font-family="'Fira Code', monospace" font-size="12" font-weight="700" text-anchor="middle">Dart</text>

      <rect x="190" y="0" width="85" height="36" rx="6" fill="#12182b" stroke="#1f293d" stroke-width="1"/>
      <text x="232" y="22" fill="#ffffff" font-family="'Fira Code', monospace" font-size="12" font-weight="700" text-anchor="middle">Kotlin</text>

      <rect x="285" y="0" width="130" height="36" rx="6" fill="#12182b" stroke="#1f293d" stroke-width="1"/>
      <text x="350" y="22" fill="#38ef7d" font-family="'Fira Code', monospace" font-size="11.5" font-weight="700" text-anchor="middle">Android SDK</text>
    </g>

    <!-- Specs Subtitle -->
    <text x="16" y="102" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5">
      ✦ Riverpod • BLoC • Offline-First Sync • Custom Render Objects • 0ms UI Jank
    </text>
    <rect x="16" y="115" width="415" height="4" rx="2" fill="#161b2e"/>
    <rect x="16" y="115" width="400" height="4" rx="2" fill="url(#neon-cyan)"/>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════
       BAY 2: WEB & MODERN FRONTEND (TOP-RIGHT)
       ══════════════════════════════════════════════════════════════════ -->
  <g transform="translate(520, 68)">
    <rect x="0" y="0" width="445" height="135" rx="12" fill="#091024" stroke="#142040" stroke-width="1.2"/>
    
    <!-- Bay Header -->
    <text x="16" y="24" fill="#a855f7" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" letter-spacing="0.5">
      🌐 WEB &amp; FRONTEND SUITE
    </text>
    <rect x="345" y="10" width="85" height="20" rx="4" fill="#a855f7" opacity="0.12" stroke="#a855f7" stroke-width="0.8"/>
    <text x="387" y="24" fill="#c084fc" font-family="'Fira Code', monospace" font-size="10" font-weight="700" text-anchor="middle">MODERN</text>

    <!-- Chips Row 1 -->
    <g transform="translate(16, 42)">
      <rect x="0" y="0" width="85" height="36" rx="6" fill="#12182b" stroke="#1f293d" stroke-width="1"/>
      <text x="42" y="22" fill="#ffffff" font-family="'Fira Code', monospace" font-size="12" font-weight="700" text-anchor="middle">React</text>

      <rect x="95" y="0" width="95" height="36" rx="6" fill="#12182b" stroke="#1f293d" stroke-width="1"/>
      <text x="142" y="22" fill="#c084fc" font-family="'Fira Code', monospace" font-size="12" font-weight="700" text-anchor="middle">Next.js</text>

      <rect x="200" y="0" width="75" height="36" rx="6" fill="#12182b" stroke="#1f293d" stroke-width="1"/>
      <text x="237" y="22" fill="#ffffff" font-family="'Fira Code', monospace" font-size="12" font-weight="700" text-anchor="middle">Vite</text>

      <rect x="285" y="0" width="130" height="36" rx="6" fill="#12182b" stroke="#1f293d" stroke-width="1"/>
      <text x="350" y="22" fill="#38ef7d" font-family="'Fira Code', monospace" font-size="11.5" font-weight="700" text-anchor="middle">Tailwind CSS</text>
    </g>

    <!-- Specs Subtitle -->
    <text x="16" y="102" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5">
