    </text>
    <rect x="16" y="115" width="415" height="4" rx="2" fill="#161b2e"/>
    <rect x="16" y="115" width="385" height="4" rx="2" fill="url(#neon-purple)"/>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════
       BAY 3: BACKEND, APIS & CLOUD (BOTTOM-LEFT)
