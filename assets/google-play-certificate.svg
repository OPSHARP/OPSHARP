<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cert-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#080812"/>
    </linearGradient>

    <!-- Google Play Colors -->
    <linearGradient id="gp-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#2b6cb0"/>
    </linearGradient>
    <linearGradient id="gp-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34A853"/>
      <stop offset="100%" stop-color="#00C853"/>
    </linearGradient>

    <!-- Animated Google Multicolor Sheen Border -->
    <linearGradient id="google-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" stop-opacity="0.8"/>
      <stop offset="25%" stop-color="#EA4335" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#FBBC04" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#34A853" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4285F4" stop-opacity="0.8"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="14s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow-badge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Animated Sheen Border -->
  <rect x="2" y="2" width="996" height="246" rx="18" fill="none" stroke="url(#google-border)" stroke-width="2.2"/>

  <!-- Card Background -->
  <rect x="4" y="4" width="992" height="242" rx="16" fill="url(#cert-bg)"/>

  <!-- Subtle Cyber Grid -->
  <g opacity="0.03" stroke="#4285F4" stroke-width="0.5">
    <line x1="0" y1="50" x2="1000" y2="50"/><line x1="0" y1="100" x2="1000" y2="100"/>
    <line x1="0" y1="150" x2="1000" y2="150"/><line x1="0" y1="200" x2="1000" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="250"/><line x1="400" y1="0" x2="400" y2="250"/>
    <line x1="600" y1="0" x2="600" y2="250"/><line x1="800" y1="0" x2="800" y2="250"/>
  </g>

  <!-- Watermark on Right -->
  <g transform="translate(870, 125)" opacity="0.08">
    <circle cx="0" cy="0" r="75" fill="none" stroke="#34A853" stroke-width="2"/>
    <polygon points="-25,-35 35,0 -25,35" fill="#34A853"/>
  </g>

  <!-- Left: Official Google Play Academy Circular Seal -->
  <g transform="translate(68, 125)">
    <!-- Outer Glow & Ring -->
    <circle cx="0" cy="0" r="48" fill="#34A853" opacity="0.08" filter="url(#glow-badge)"/>
    <circle cx="0" cy="0" r="42" fill="#12182b" stroke="#34A853" stroke-width="2"/>
    
    <!-- Rotating Dash Ring -->
    <circle cx="0" cy="0" r="46" fill="none" stroke="#4285F4" stroke-width="1.2" stroke-dasharray="5 6" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </circle>

    <!-- Google Play Triangle Icon -->
    <g transform="translate(-14, -18) scale(1.3)">
      <path d="M 1 1 L 18 14 L 1 27 Z" fill="#4285F4"/>
      <path d="M 1 1 L 14 10 L 18 14 L 1 1 Z" fill="#EA4335" opacity="0.9"/>
      <path d="M 1 27 L 14 18 L 18 14 L 1 27 Z" fill="#34A853" opacity="0.9"/>
      <path d="M 14 10 L 22 14 L 14 18 L 18 14 Z" fill="#FBBC04"/>
    </g>
  </g>

  <!-- Header Category Pill -->
  <g transform="translate(140, 44)">
    <rect x="0" y="-18" width="260" height="24" rx="6" fill="#34A853" opacity="0.12" stroke="#34A853" stroke-width="0.8"/>
    <text x="130" y="-2" fill="#34A853" font-family="'Fira Code', monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">
      GOOGLE PLAY ACADEMY // CERTIFIED
    </text>
    
    <!-- Main Title -->
    <text x="0" y="24" fill="#ffffff" font-family="'Segoe UI', Roboto, system-ui, sans-serif" font-size="22" font-weight="800" letter-spacing="0.3">
      Google Play Store Listing Certificate
    </text>
  </g>

  <!-- Recipient & Cert Details Row -->
  <g transform="translate(140, 108)">
    <!-- Certified To Pill -->
    <rect x="0" y="0" width="220" height="34" rx="8" fill="#161b2e" stroke="#1f293d" stroke-width="1"/>
    <text x="14" y="22" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="12" font-weight="600">
      CERTIFIED: <tspan fill="#00F2FE" font-weight="700">Nitesh Kumar</tspan>
    </text>

    <!-- Certificate ID Pill -->
    <rect x="235" y="0" width="230" height="34" rx="8" fill="#161b2e" stroke="#1f293d" stroke-width="1"/>
    <text x="248" y="22" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="12" font-weight="600">
      CERT ID: <tspan fill="#34A853" font-weight="700">186897324</tspan>
    </text>

    <!-- Validity Pill -->
    <rect x="480" y="0" width="270" height="34" rx="8" fill="#161b2e" stroke="#1f293d" stroke-width="1"/>
    <text x="494" y="22" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="12" font-weight="600">
      VALID: <tspan fill="#FBBC04" font-weight="700">June 2026 – June 2029</tspan>
    </text>
  </g>

  <!-- Description / Authority Row -->
  <g transform="translate(140, 168)">
    <text x="0" y="0" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13">
      🎯 <tspan fill="#e2e8f0" font-weight="600">Core Competencies:</tspan> App Store Optimization (ASO) • Store Listing Experimentation • Google Play Policy Compliance
    </text>
    <text x="0" y="22" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12">
      ✍️ Authorized by <tspan fill="#ffffff" font-weight="600">Urvi Palav</tspan> (Head of Google Play Academy) • Official Credential
    </text>
  </g>

  <!-- Live Verified Badge (Bottom Right) -->
  <g transform="translate(800, 212)">
    <circle cx="0" cy="0" r="5" fill="#34A853">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="12" y="4" fill="#34A853" font-family="'Fira Code', monospace" font-size="11" font-weight="700" letter-spacing="1">
      OFFICIALLY VERIFIED
    </text>
  </g>
</svg>
