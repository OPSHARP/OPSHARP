<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cert-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#121324"/>
      <stop offset="100%" stop-color="#080812"/>
    </linearGradient>

    <!-- Gold / Saffron Accent -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>

    <!-- Emerald / Green Accent -->
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#138808"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>

    <!-- Cyan Accent -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <!-- Animated Sheen Border -->
    <linearGradient id="cert-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#138808" stop-opacity="0.8"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="12s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Animated Sheen Border -->
  <rect x="2" y="2" width="996" height="236" rx="16" fill="none" stroke="url(#cert-border)" stroke-width="2"/>

  <!-- Card Background -->
  <rect x="4" y="4" width="992" height="232" rx="14" fill="url(#cert-bg)"/>

  <!-- Subtle Watermark Seal (Right Side) -->
  <g transform="translate(860, 120)" opacity="0.12">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#FF9933" stroke-width="2"/>
    <circle cx="0" cy="0" r="58" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="46" fill="none" stroke="#138808" stroke-width="2"/>
    <text x="0" y="8" fill="#FFD700" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="900" text-anchor="middle">MSME</text>
  </g>

  <!-- Left Seal Icon: Official Shield Badge -->
  <g transform="translate(60, 120)">
    <!-- Outer Glow Circle -->
    <circle cx="0" cy="0" r="44" fill="#FF9933" opacity="0.08" filter="url(#badge-glow)"/>
    <circle cx="0" cy="0" r="38" fill="#161b2e" stroke="url(#gold-grad)" stroke-width="2"/>
    
    <!-- Shield Graphic -->
    <path d="M 0 -22 L 20 -12 L 20 6 C 20 18 0 25 0 25 C 0 25 -20 18 -20 6 L -20 -12 Z" fill="none" stroke="url(#gold-grad)" stroke-width="2.2"/>
    <!-- Checkmark -->
    <path d="M -7 1 L -2 7 L 8 -4" fill="none" stroke="#38ef7d" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Rotating Ring -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="#00F2FE" stroke-width="1" stroke-dasharray="5 7" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Header Text -->
  <g transform="translate(130, 48)">
    <rect x="0" y="-18" width="220" height="24" rx="6" fill="#FF9933" opacity="0.12" stroke="#FF9933" stroke-width="0.8"/>
    <text x="110" y="-2" fill="#FF9933" font-family="'Fira Code', monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">
      GOVERNMENT OF INDIA • MSME
    </text>
    
    <text x="0" y="24" fill="#ffffff" font-family="'Segoe UI', Roboto, system-ui, sans-serif" font-size="22" font-weight="800" letter-spacing="0.3">
      UDYAM REGISTRATION CERTIFICATE
    </text>
  </g>

  <!-- Enterprise & Reg Number Block -->
  <g transform="translate(130, 110)">
    <!-- Reg Number Pill -->
    <rect x="0" y="0" width="310" height="32" rx="8" fill="#161b2e" stroke="#1f293d" stroke-width="1"/>
    <text x="14" y="21" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="12" font-weight="600">
      REG NO: <tspan fill="url(#cyan-glow)" font-weight="700">UDYAM-UP-18-0090815</tspan>
    </text>

    <!-- Enterprise Name Pill -->
    <rect x="325" y="0" width="220" height="32" rx="8" fill="#161b2e" stroke="#1f293d" stroke-width="1"/>
    <text x="340" y="21" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="12" font-weight="600">
      ENTERPRISE: <tspan fill="#38ef7d" font-weight="700">SHARP OP</tspan>
    </text>

    <!-- Type -->
    <rect x="560" y="0" width="180" height="32" rx="8" fill="#161b2e" stroke="#1f293d" stroke-width="1"/>
    <text x="575" y="21" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="12" font-weight="600">
      TYPE: <tspan fill="#FFD700" font-weight="700">Micro (Services)</tspan>
    </text>
  </g>

  <!-- Classification Details -->
  <g transform="translate(130, 168)">
    <text x="0" y="0" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13">
      🏛️ <tspan fill="#e2e8f0" font-weight="600">National Industry Classification (NIC 62011):</tspan> Computer Programming, Consultancy &amp; Custom Software Solutions
    </text>
    <text x="0" y="22" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12">
      📍 Registered in Bulandshahr, Uttar Pradesh • 100% Legally Compliant &amp; Contract-Ready
    </text>
  </g>

  <!-- Live Verified Status (Bottom Right) -->
  <g transform="translate(810, 204)">
    <circle cx="0" cy="0" r="5" fill="#38ef7d">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="12" y="4" fill="#38ef7d" font-family="'Fira Code', monospace" font-size="11" font-weight="700" letter-spacing="1">
      OFFICIALLY VERIFIED
    </text>
  </g>
</svg>
