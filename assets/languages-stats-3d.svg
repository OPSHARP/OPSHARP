<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="lang-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050714"/>
      <stop offset="50%" stop-color="#090d22"/>
      <stop offset="100%" stop-color="#040612"/>
    </linearGradient>

    <!-- Language Colors -->
    <linearGradient id="dart-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#00C853"/>
    </linearGradient>
    <linearGradient id="cpp-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="js-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="py-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="kt-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Animated Border Sheen -->
    <linearGradient id="lang-sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#38ef7d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.9"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="14s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Animated Sheen Frame -->
  <rect x="2" y="2" width="996" height="316" rx="18" fill="none" stroke="url(#lang-sheen)" stroke-width="2.2"/>

  <!-- Card Background -->
  <rect x="4" y="4" width="992" height="312" rx="16" fill="url(#lang-bg)"/>

  <!-- Subtle Perspective Grid -->
  <g opacity="0.04" stroke="#00F2FE" stroke-width="0.5">
    <line x1="0" y1="80" x2="1000" y2="80"/><line x1="0" y1="160" x2="1000" y2="160"/><line x1="0" y1="240" x2="1000" y2="240"/>
    <line x1="480" y1="0" x2="480" y2="320"/>
  </g>

  <!-- Top Status Ticker -->
  <g transform="translate(35, 34)">
    <text x="0" y="0" fill="#00F2FE" font-family="'Fira Code', monospace" font-size="11.5" font-weight="700" letter-spacing="1.5">
      📊 3D GITHUB STATS &amp; PROGRAMMING LANGUAGES ENGINE // VERIFIED METRICS
    </text>
    <text x="930" y="0" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="11" font-weight="600" text-anchor="end">
      SOURCE: GITHUB GRAPHQL API ✦
    </text>
  </g>

  <!-- Divider Line -->
  <line x1="35" y1="46" x2="965" y2="46" stroke="#1f293d" stroke-width="1.2"/>

  <!-- ══════════════════════════════════════════════════════════════════
       LEFT SIDE: 3D GITHUB STATISTICS MATRIX
       ══════════════════════════════════════════════════════════════════ -->
  <g transform="translate(45, 68)">
    <text x="0" y="14" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" letter-spacing="0.5">
      ⚡ GITHUB CORE STATISTICS
    </text>

    <!-- Metric Card 1: Total Repositories -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="195" height="66" rx="10" fill="#0d1428" stroke="#16203a" stroke-width="1"/>
      <text x="16" y="24" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="10" font-weight="600">
        PUBLIC REPOSITORIES
      </text>
      <text x="16" y="52" fill="#00F2FE" font-family="'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900">
        21 <tspan fill="#38ef7d" font-size="12">ACTIVE</tspan>
      </text>
      <circle cx="165" cy="33" r="14" fill="#00F2FE" opacity="0.1"/>
      <text x="165" y="38" fill="#00F2FE" font-size="14" text-anchor="middle">📦</text>
    </g>

    <!-- Metric Card 2: Production Shipments -->
    <g transform="translate(210, 30)">
      <rect x="0" y="0" width="195" height="66" rx="10" fill="#0d1428" stroke="#16203a" stroke-width="1"/>
      <text x="16" y="24" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="10" font-weight="600">
        GOOGLE PLAY APPS
      </text>
      <text x="16" y="52" fill="#38ef7d" font-family="'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900">
        27+ <tspan fill="#a855f7" font-size="12">LIVE</tspan>
      </text>
      <circle cx="165" cy="33" r="14" fill="#38ef7d" opacity="0.1"/>
      <text x="165" y="38" fill="#38ef7d" font-size="14" text-anchor="middle">🚀</text>
    </g>

    <!-- Metric Card 3: Google Certified -->
    <g transform="translate(0, 110)">
      <rect x="0" y="0" width="195" height="66" rx="10" fill="#0d1428" stroke="#16203a" stroke-width="1"/>
      <text x="16" y="24" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="10" font-weight="600">
        GOOGLE PLAY ACADEMY
      </text>
      <text x="16" y="52" fill="#ffaa33" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">
        CERTIFIED
      </text>
      <circle cx="165" cy="33" r="14" fill="#ffaa33" opacity="0.1"/>
      <text x="165" y="38" fill="#ffaa33" font-size="14" text-anchor="middle">🏆</text>
    </g>

    <!-- Metric Card 4: Code Architecture Quality -->
    <g transform="translate(210, 110)">
      <rect x="0" y="0" width="195" height="66" rx="10" fill="#0d1428" stroke="#16203a" stroke-width="1"/>
      <text x="16" y="24" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="10" font-weight="600">
        CODE ARCHITECTURE
      </text>
      <text x="16" y="52" fill="#a855f7" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900">
        0% <tspan fill="#00F2FE" font-size="12">SLOP</tspan>
      </text>
      <circle cx="165" cy="33" r="14" fill="#a855f7" opacity="0.1"/>
      <text x="165" y="38" fill="#a855f7" font-size="14" text-anchor="middle">💎</text>
    </g>

    <!-- Bottom Health Pill -->
    <g transform="translate(0, 190)">
      <rect x="0" y="0" width="405" height="30" rx="6" fill="#12182b" stroke="#1f293d" stroke-width="0.8"/>
      <text x="14" y="20" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="11" font-weight="600">
        HEALTH GRADE: <tspan fill="#38ef7d" font-weight="700">A+ EXCELLENT</tspan> • <tspan fill="#00F2FE">60/120 FPS FLUID</tspan>
      </text>
    </g>
  </g>

  <!-- Vertical Divider Between Sides -->
  <line x1="475" y1="65" x2="475" y2="295" stroke="#1f293d" stroke-width="1.2" stroke-dasharray="4 6"/>

  <!-- ══════════════════════════════════════════════════════════════════
       RIGHT SIDE: 3D PROGRAMMING LANGUAGES VISUALIZER
       ══════════════════════════════════════════════════════════════════ -->
  <g transform="translate(510, 68)">
    <text x="0" y="14" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" letter-spacing="0.5">
      🔮 MOST USED PROGRAMMING LANGUAGES
    </text>

    <!-- Language 1: Dart / Flutter (95.1%) -->
    <g transform="translate(0, 32)">
      <circle cx="6" cy="6" r="4" fill="#00F2FE"/>
      <text x="18" y="10" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="12" font-weight="700">Dart / Flutter</text>
      <text x="440" y="10" fill="#00F2FE" font-family="'Fira Code', monospace" font-size="12" font-weight="700" text-anchor="end">95.1%</text>
      
      <rect x="0" y="18" width="440" height="7" rx="3.5" fill="#141a2e"/>
      <rect x="0" y="18" width="418" height="7" rx="3.5" fill="url(#dart-cyan)" filter="url(#neon-glow)">
        <animate attributeName="width" values="0;418" dur="1.5s" fill="freeze"/>
      </rect>
    </g>

    <!-- Language 2: C++ / Native Systems (1.3%) -->
    <g transform="translate(0, 72)">
      <circle cx="6" cy="6" r="4" fill="#60a5fa"/>
      <text x="18" y="10" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="12" font-weight="700">C++ / Native Core</text>
      <text x="440" y="10" fill="#60a5fa" font-family="'Fira Code', monospace" font-size="12" font-weight="700" text-anchor="end">1.3%</text>
      
      <rect x="0" y="18" width="440" height="7" rx="3.5" fill="#141a2e"/>
      <rect x="0" y="18" width="80" height="7" rx="3.5" fill="url(#cpp-blue)"/>
    </g>

    <!-- Language 3: JavaScript / TypeScript (1.0%) -->
    <g transform="translate(0, 112)">
      <circle cx="6" cy="6" r="4" fill="#fbbf24"/>
      <text x="18" y="10" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="12" font-weight="700">JavaScript / TS</text>
      <text x="440" y="10" fill="#fbbf24" font-family="'Fira Code', monospace" font-size="12" font-weight="700" text-anchor="end">1.0%</text>
      
      <rect x="0" y="18" width="440" height="7" rx="3.5" fill="#141a2e"/>
      <rect x="0" y="18" width="65" height="7" rx="3.5" fill="url(#js-gold)"/>
    </g>

    <!-- Language 4: Python / AI (0.8%) -->
    <g transform="translate(0, 152)">
      <circle cx="6" cy="6" r="4" fill="#34d399"/>
      <text x="18" y="10" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="12" font-weight="700">Python / AI ML</text>
      <text x="440" y="10" fill="#34d399" font-family="'Fira Code', monospace" font-size="12" font-weight="700" text-anchor="end">0.8%</text>
      
      <rect x="0" y="18" width="440" height="7" rx="3.5" fill="#141a2e"/>
      <rect x="0" y="18" width="55" height="7" rx="3.5" fill="url(#py-green)"/>
    </g>

    <!-- Language 5: Kotlin / Android (0.5%) -->
    <g transform="translate(0, 192)">
      <circle cx="6" cy="6" r="4" fill="#c084fc"/>
      <text x="18" y="10" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="12" font-weight="700">Kotlin / Android SDK</text>
      <text x="440" y="10" fill="#c084fc" font-family="'Fira Code', monospace" font-size="12" font-weight="700" text-anchor="end">0.5%</text>
      
      <rect x="0" y="18" width="440" height="7" rx="3.5" fill="#141a2e"/>
      <rect x="0" y="18" width="45" height="7" rx="3.5" fill="url(#kt-purple)"/>
    </g>
  </g>
</svg>
