<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <defs>
    <!-- Hazard Stripe Pattern -->
    <pattern id="hazard-stripes" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="20" height="40" fill="#ff003b" opacity="0.85"/>
      <rect x="20" width="20" height="40" fill="#ffd700" opacity="0.95"/>
    </pattern>

    <pattern id="cyber-grid-dense" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ff0055" stroke-width="0.8" opacity="0.18"/>
    </pattern>

    <!-- Neon Danger Glow Filters -->
    <filter id="danger-glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="danger-glow-yellow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="danger-core" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="35%" stop-color="#ff3300"/>
      <stop offset="70%" stop-color="#ffcc00"/>
      <stop offset="100%" stop-color="#ff0055"/>
    </linearGradient>

    <linearGradient id="glitch-laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff003b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff003b" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </linearGradient>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes blinkDanger {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 18px #ff003b) drop-shadow(0 0 35px #ff5500); }
        50% { opacity: 0.45; filter: drop-shadow(0 0 6px #ff003b); }
      }
      @keyframes rotateRadar {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes scanCrosshair {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.18); opacity: 1; }
      }
      @keyframes laserSweep {
        0% { transform: translateX(-1200px); }
        100% { transform: translateX(1200px); }
      }
      @keyframes glitchGlitch {
        0%, 92%, 100% { transform: translate(0, 0); }
        93% { transform: translate(-3px, 2px); }
        95% { transform: translate(3px, -2px); }
        97% { transform: translate(-2px, -1px); }
      }
      @keyframes pulseWarning {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
      }
      .danger-blink {
        animation: blinkDanger 1.2s infinite ease-in-out;
      }
      .radar-sweep {
        animation: rotateRadar 6s linear infinite;
        transform-origin: center;
      }
      .crosshair-scan {
        animation: scanCrosshair 2s infinite ease-in-out;
        transform-origin: center;
      }
      .laser-scanline {
        animation: laserSweep 3s linear infinite;
      }
      .glitch-text {
        animation: glitchGlitch 3.5s infinite;
      }
      .pulse-pill {
        animation: pulseWarning 2s infinite ease-in-out;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- PURE BLACK BACKGROUND -->
  <rect width="1200" height="240" fill="#000000"/>
  <rect width="1200" height="240" fill="url(#cyber-grid-dense)"/>

  <!-- TOP HAZARD TAPE STRIPE -->
  <rect x="0" y="0" width="1200" height="12" fill="url(#hazard-stripes)"/>
  <!-- BOTTOM HAZARD TAPE STRIPE -->
  <rect x="0" y="228" width="1200" height="12" fill="url(#hazard-stripes)"/>

  <!-- SCANNING LASER BEAM -->
  <rect x="0" y="11" width="400" height="2" fill="url(#glitch-laser)" class="laser-scanline"/>
  <rect x="0" y="227" width="400" height="2" fill="url(#glitch-laser)" class="laser-scanline"/>

  <!-- CYBERNETIC OUTER HUD FRAME -->
  <rect x="30" y="22" width="1140" height="196" rx="14" fill="#050103" stroke="#ff003b" stroke-width="2" opacity="0.9"/>
  <rect x="34" y="26" width="1132" height="188" rx="10" fill="none" stroke="#ffd700" stroke-width="0.8" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- CORNER BRACKETS -->
  <path d="M 30 50 L 30 22 L 60 22" fill="none" stroke="#ff003b" stroke-width="4"/>
  <path d="M 1170 50 L 1170 22 L 1140 22" fill="none" stroke="#ffd700" stroke-width="4"/>
  <path d="M 30 190 L 30 218 L 60 218" fill="none" stroke="#ffd700" stroke-width="4"/>
  <path d="M 1170 190 L 1170 218 L 1140 218" fill="none" stroke="#ff003b" stroke-width="4"/>

  <!-- LEFT TARGET RADAR RETICLE -->
  <g transform="translate(110, 120)">
    <circle cx="0" cy="0" r="42" fill="#140005" stroke="#ff003b" stroke-width="1.5" opacity="0.8"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#ffd700" stroke-width="1" stroke-dasharray="4 3"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#ff003b" stroke-width="1.2"/>
    <line x1="-48" y1="0" x2="48" y2="0" stroke="#ff003b" stroke-width="1" stroke-dasharray="4 2"/>
    <line x1="0" y1="-48" x2="0" y2="48" stroke="#ff003b" stroke-width="1" stroke-dasharray="4 2"/>
    <!-- Radar beam -->
    <g class="radar-sweep">
      <line x1="0" y1="0" x2="38" y2="-18" stroke="#ffd700" stroke-width="2"/>
      <polygon points="0,0 36,-24 40,-10" fill="#ffd700" opacity="0.25"/>
    </g>
    <circle cx="0" cy="0" r="4" fill="#ff003b" class="danger-blink"/>
  </g>

  <!-- RIGHT TARGET RADAR RETICLE -->
  <g transform="translate(1090, 120)">
    <circle cx="0" cy="0" r="42" fill="#140005" stroke="#ff003b" stroke-width="1.5" opacity="0.8"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#ffd700" stroke-width="1" stroke-dasharray="4 3"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#ff003b" stroke-width="1.2"/>
    <line x1="-48" y1="0" x2="48" y2="0" stroke="#ff003b" stroke-width="1" stroke-dasharray="4 2"/>
    <line x1="0" y1="-48" x2="0" y2="48" stroke="#ff003b" stroke-width="1" stroke-dasharray="4 2"/>
    <g class="radar-sweep">
      <line x1="0" y1="0" x2="-35" y2="22" stroke="#ff003b" stroke-width="2"/>
      <polygon points="0,0 -38,15 -30,28" fill="#ff003b" opacity="0.25"/>
    </g>
    <circle cx="0" cy="0" r="4" fill="#ffd700" class="danger-blink"/>
  </g>

  <!-- TOP STATUS BADGE -->
  <g transform="translate(600, 52)" class="pulse-pill">
    <rect x="-240" y="-14" width="480" height="28" rx="14" fill="#1c0008" stroke="#ff003b" stroke-width="1.6" filter="url(#danger-glow-red)"/>
    <circle cx="-215" cy="0" r="5" fill="#ff003b" class="danger-blink"/>
    <circle cx="215" cy="0" r="5" fill="#ff003b" class="danger-blink"/>
    <text x="0" y="5" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="900" fill="#ffd700" text-anchor="middle" letter-spacing="3">
      ⚠️ THREAT WARNING // BEAST-MODE ACTIVATED ⚠️
    </text>
  </g>

  <!-- CENTER MAIN DANGER HEADLINE -->
  <g transform="translate(600, 118)" class="glitch-text">
    <!-- Drop Shadow Glowing Danger -->
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" text-anchor="middle" letter-spacing="7" fill="#ff003b" filter="url(#danger-glow-red)">
      TARUN // LETHAL FULL-STACK ARCHITECT
    </text>
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" text-anchor="middle" letter-spacing="7" fill="url(#danger-core)">
      TARUN // LETHAL FULL-STACK ARCHITECT
    </text>
  </g>

  <!-- SUBTITLE TELEMETRY METRICS -->
  <g transform="translate(600, 155)">
    <text x="0" y="0" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="2.5" fill="#ff4d4d">
      [ CODE POWER: <tspan fill="#ffd700">99.9%</tspan> ]
      &nbsp;•&nbsp;
      [ PLAY STORE WEAPONS: <tspan fill="#39ff14">27+ APPS</tspan> ]
      &nbsp;•&nbsp;
      [ COMBAT: <tspan fill="#00f2fe">FLUTTER • WEB • TEMPLATES</tspan> ]
    </text>
  </g>

  <!-- BOTTOM CAPABILITY SCANNER BAR -->
  <g transform="translate(600, 192)">
    <!-- Pill 1 -->
    <g transform="translate(-320, -12)">
      <rect x="0" y="0" width="145" height="24" rx="6" fill="#140205" stroke="#ff003b" stroke-width="1.2"/>
      <text x="72" y="16" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">⚡ 25 Y/O PRODIGY</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-155, -12)">
      <rect x="0" y="0" width="145" height="24" rx="6" fill="#140801" stroke="#ff7700" stroke-width="1.2"/>
      <text x="72" y="16" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">🔥 27+ PLAY APPS</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(10, -12)">
      <rect x="0" y="0" width="145" height="24" rx="6" fill="#011409" stroke="#00e676" stroke-width="1.2"/>
      <text x="72" y="16" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">💎 MOBILE &amp; SAAS</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(175, -12)">
      <rect x="0" y="0" width="145" height="24" rx="6" fill="#020f17" stroke="#00f2fe" stroke-width="1.2"/>
      <text x="72" y="16" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">🚀 HIRE GLOBALLY</text>
    </g>
  </g>
</svg>
