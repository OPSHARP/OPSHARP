<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="streak-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060814"/>
      <stop offset="50%" stop-color="#0e0f26"/>
      <stop offset="100%" stop-color="#070716"/>
    </linearGradient>

    <!-- Fire / Flame Gradient -->
    <linearGradient id="flame-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff3300"/>
      <stop offset="50%" stop-color="#ff7b00"/>
      <stop offset="85%" stop-color="#ffcc00"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Cyan Electric Gradient -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <!-- Gold Trophy Gradient -->
    <linearGradient id="gold-streak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>

    <!-- Animated Border Sheen -->
    <linearGradient id="streak-sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b00" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#00F2FE" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff7b00" stop-opacity="0.9"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="12s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Laser Beam Pulse -->
    <linearGradient id="laser-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff7b00" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;100%" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="3s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="flame-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Sheen Frame -->
  <rect x="2" y="2" width="996" height="236" rx="18" fill="none" stroke="url(#streak-sheen)" stroke-width="2.2"/>

  <!-- Card Background -->
  <rect x="4" y="4" width="992" height="232" rx="16" fill="url(#streak-bg)"/>

  <!-- Subtle Perspective Grid -->
  <g opacity="0.04" stroke="#ff7b00" stroke-width="0.5">
    <line x1="0" y1="60" x2="1000" y2="60"/><line x1="0" y1="120" x2="1000" y2="120"/><line x1="0" y1="180" x2="1000" y2="180"/>
    <line x1="333" y1="0" x2="333" y2="240"/><line x1="666" y1="0" x2="666" y2="240"/>
  </g>

  <!-- Top Title Ticker -->
  <g transform="translate(35, 34)">
    <text x="0" y="0" fill="#ff7b00" font-family="'Fira Code', monospace" font-size="11.5" font-weight="700" letter-spacing="1.5">
      🔥 3D STREAK &amp; CONTRIBUTION TELEMETRY // REAL-TIME SHIPPING MATRIX
    </text>
    <text x="930" y="0" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="11" font-weight="600" text-anchor="end">
      LIVE_SYNC // 2026 SEASON
    </text>
  </g>

  <!-- Horizontal Laser Guideline -->
  <line x1="35" y1="48" x2="965" y2="48" stroke="#1f293d" stroke-width="1"/>
  <line x1="35" y1="48" x2="965" y2="48" stroke="url(#laser-beam)" stroke-width="2"/>

  <!-- ══════════════════════════════════════════════════════════════════
       CARD 1: LEFT — TOTAL CONTRIBUTIONS
       ══════════════════════════════════════════════════════════════════ -->
  <g transform="translate(180, 138)">
    <!-- Ambient Glow Orb -->
    <circle cx="0" cy="-8" r="45" fill="#00F2FE" opacity="0.06" filter="url(#flame-glow)"/>

    <!-- Rotating Isometric Ring -->
    <ellipse cx="0" cy="-8" rx="42" ry="18" fill="none" stroke="#00F2FE" stroke-width="1" stroke-dasharray="4 6" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Big Number -->
    <text x="0" y="2" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" text-anchor="middle" letter-spacing="1">
      84<tspan fill="url(#cyan-glow)">+</tspan>
    </text>

    <!-- Label -->
    <text x="0" y="24" fill="#00F2FE" font-family="'Fira Code', monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">
      TOTAL CONTRIBUTIONS
    </text>

    <!-- Micro Badge -->
    <rect x="-70" y="34" width="140" height="20" rx="4" fill="#12182b" stroke="#1f293d" stroke-width="0.8"/>
    <text x="0" y="48" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="9.5" font-weight="600" text-anchor="middle">
      Season 2026 Active
    </text>
  </g>

  <!-- Vertical Divider 1 -->
  <line x1="333" y1="65" x2="333" y2="215" stroke="#161f36" stroke-width="1.2" stroke-dasharray="4 6"/>

  <!-- ══════════════════════════════════════════════════════════════════
       CARD 2: CENTER — CURRENT STREAK (THE FIREPIECE!)
       ══════════════════════════════════════════════════════════════════ -->
  <g transform="translate(500, 135)">
    <!-- Holographic Flame Center -->
    <g transform="translate(0, -32) scale(1.1)">
      <!-- Pulsing Outer Flame Core -->
      <path d="M 0 -18 C 10 -4 14 6 10 14 C 6 22 -6 22 -10 14 C -14 6 -10 -4 0 -18 Z" fill="url(#flame-grad)" opacity="0.9" filter="url(#flame-glow)">
        <animate attributeName="d" values="M 0 -18 C 10 -4 14 6 10 14 C 6 22 -6 22 -10 14 C -14 6 -10 -4 0 -18 Z;M 0 -22 C 12 -6 16 8 10 16 C 4 24 -8 22 -12 14 C -15 4 -12 -6 0 -22 Z;M 0 -18 C 10 -4 14 6 10 14 C 6 22 -6 22 -10 14 C -14 6 -10 -4 0 -18 Z" dur="1.4s" repeatCount="indefinite"/>
      </path>
      <!-- Inner White Flame Core -->
      <path d="M 0 -8 C 5 -1 7 4 5 8 C 3 12 -3 12 -5 8 C -7 4 -5 -1 0 -8 Z" fill="#ffffff" opacity="0.95">
        <animate attributeName="opacity" values="0.9;1;0.9" dur="0.8s" repeatCount="indefinite"/>
      </path>
      <!-- Spark Particles Floating -->
      <circle cx="-6" cy="-12" r="1.5" fill="#ffcc00">
        <animate attributeName="cy" values="-12;-28;-12" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="8" cy="-10" r="1.2" fill="#ff7b00">
        <animate attributeName="cy" values="-10;-24;-10" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Big Streak Number -->
    <text x="0" y="8" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="900" text-anchor="middle" letter-spacing="1">
      7 <tspan fill="url(#flame-grad)" font-size="30">DAYS</tspan>
    </text>

    <!-- Label -->
    <text x="0" y="28" fill="#ff7b00" font-family="'Fira Code', monospace" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="1.5">
      CURRENT STREAK
    </text>

    <!-- Status Pill -->
    <g transform="translate(0, 42)">
      <rect x="-85" y="0" width="170" height="22" rx="11" fill="#ff7b00" opacity="0.15" stroke="#ff7b00" stroke-width="0.8"/>
      <circle cx="-68" cy="11" r="3.5" fill="#ff7b00">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="5" y="15" fill="#ffaa33" font-family="'Fira Code', monospace" font-size="9.5" font-weight="700" text-anchor="middle">
        ACTIVE &amp; UNBROKEN
      </text>
    </g>
  </g>

  <!-- Vertical Divider 2 -->
  <line x1="666" y1="65" x2="666" y2="215" stroke="#161f36" stroke-width="1.2" stroke-dasharray="4 6"/>

  <!-- ══════════════════════════════════════════════════════════════════
       CARD 3: RIGHT — LONGEST STREAK
       ══════════════════════════════════════════════════════════════════ -->
  <g transform="translate(820, 138)">
    <!-- Ambient Gold Glow -->
    <circle cx="0" cy="-8" r="45" fill="#f59e0b" opacity="0.06" filter="url(#flame-glow)"/>

    <!-- Rotating Diamond Star -->
    <g transform="translate(0, -8)">
      <rect x="-18" y="-18" width="36" height="36" rx="4" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.3">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Big Number -->
    <text x="0" y="2" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" text-anchor="middle" letter-spacing="1">
      7 <tspan fill="url(#gold-streak)" font-size="28">DAYS</tspan>
    </text>

    <!-- Label -->
    <text x="0" y="24" fill="#ffd700" font-family="'Fira Code', monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">
      LONGEST STREAK
    </text>

    <!-- Micro Badge -->
    <rect x="-70" y="34" width="140" height="20" rx="4" fill="#12182b" stroke="#1f293d" stroke-width="0.8"/>
    <text x="0" y="48" fill="#ffd700" font-family="'Fira Code', monospace" font-size="9.5" font-weight="600" text-anchor="middle">
      ⚡ ALL-TIME RECORD
    </text>
  </g>
</svg>
